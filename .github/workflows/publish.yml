name: Publish RelayHistory release

# One release for everything this repository ships. Builds and tests native
# artifacts, publishes platform packages first, then the native root, SDK/CLI,
# and MCP packages. The public SDK is deliberately last so npm can never select
# a release whose mandatory native engine is not available yet. The optional
# provider-sources plugin follows at the very same version, once the core
# release exists and its registry gates have passed.
#
# The file name is load-bearing: npm OIDC trusted publishing binds each package
# to this repository plus this workflow file name, so renaming this file breaks
# every package's publish until its trusted publisher is repointed on npmjs.
#
# It was `publish-napi.yml` until the optional plugins were first published.
# Every other AgentWorkforce repository publishes from `publish.yml`, and that
# mismatch cost a release cycle: the plugins' trusted publishers were set to
# `publish.yml` by analogy with the sibling repos, and npm rejected the publish
# as E404 -- which reads as "no such package", not "wrong workflow".

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      custom_version:
        description: 'Custom version (optional, overrides version bump type)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (build only, no publish)'
        required: true
        default: false
        type: boolean
      plugins:
        description: 'Also publish the optional history plugins at the same version'
        required: false
        default: true
        type: boolean
      skip_core:
        description: 'Verify and finish plugins/crates.io for an already published core version; requires custom_version'
        required: false
        default: false
        type: boolean

# Least privilege: the build matrix needs neither repo writes nor OIDC.
permissions:
  contents: read

# A release publishes several packages that must share one exact version.
concurrency:
  group: publish-relayhistory
  cancel-in-progress: false

defaults:
  run:
    working-directory: crates/ai-hist-napi

jobs:
  # The release version is resolved once, before anything is built, because the
  # helper matrix stamps it into the Rust crates it compiles. A `skip_core`
  # re-run names an already published version instead, and every job that builds
  # then checks out that release's tag rather than the dispatch commit.
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    outputs:
      version: ${{ steps.version.outputs.version }}
    # No checkout and no third-party action: the runner's own node, npm and gh
    # are enough to read the registry and the tag list, so nothing untrusted
    # runs before the version that every later job trusts is decided.
    steps:
      - name: Resolve release version
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          SKIP_CORE: ${{ inputs.skip_core }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$SKIP_CORE" = "true" ]; then
            # A plugin-only re-run has no publish job to name the version,
            # and it must rebuild the code that release actually shipped.
            if [ -z "$CUSTOM_VERSION" ]; then
              echo "skip_core needs custom_version: the already published core version the plugins belong to" >&2
              exit 1
            fi
            VERSION="$CUSTOM_VERSION"
          elif [ -n "$CUSTOM_VERSION" ]; then
            VERSION="$CUSTOM_VERSION"
          else
            # The registry determines the next version. A successful release
            # persists that version back to the checked-in manifests in publish.
            # Use the highest published semver across the public packages so a
            # partial release (native only) cannot collide on the next patch.
            CURRENT_VERSION=$(node -e '
              const { execSync } = require("node:child_process");
              const versions = ["ai-hist", "ai-hist-native"].map((pkg) =>
                execSync(`npm view ${pkg} version`, { encoding: "utf8" }).trim(),
              );
              const key = (version) => version.split(".").map(Number);
              versions.sort((left, right) => {
                const [a, b] = [key(left), key(right)];
                for (let index = 0; index < 3; index += 1) {
                  if (a[index] !== b[index]) return a[index] - b[index];
                }
                return 0;
              });
              process.stdout.write(versions.at(-1));
            ')
            VERSION=$(node -e '
              const [current, bump] = process.argv.slice(1);
              const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(current);
              if (!match) throw new Error("Expected a stable semver, received " + current);
              let [, major, minor, patch] = match.map(Number);
              if (bump === "major") [major, minor, patch] = [major + 1, 0, 0];
              else if (bump === "minor") [minor, patch] = [minor + 1, 0];
              else if (bump === "patch") patch += 1;
              else throw new Error("Unsupported version bump: " + bump);
              process.stdout.write([major, minor, patch].join("."));
            ' "$CURRENT_VERSION" "$VERSION_TYPE")
          fi
          node -e '
            const version = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error("Version must be a stable semver: " + version);
            }
          ' "$VERSION"
          if [ "$SKIP_CORE" = "true" ]; then
            # The helper and plugin jobs build from this tag, so it has to exist
            # before anything is compiled. `publish` creates it on a normal run.
            if ! gh api "repos/${{ github.repository }}/git/ref/tags/sdk-ts-v$VERSION" >/dev/null 2>&1; then
              echo "No release tag sdk-ts-v$VERSION; skip_core only re-runs a release this workflow already cut" >&2
              exit 1
            fi
            echo "Re-running plugins from the tag sdk-ts-v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version $VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: ${{ !inputs.skip_core }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            test_native: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            test_native: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: true
            glibc: '2.28'
            test_native: true
            test_glibc: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: true
            glibc: '2.28'
            test_native: true
            test_glibc: true
            # Zig 0.13 cannot link the Cortex-A53 flag emitted by Rust 1.98.
            rust: 1.97.0
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            test_musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cross: true
            # Rust 1.98 adds --fix-cortex-a53-843419, which Zig 0.13 rejects.
            # Keep this target on the last compatible toolchain until Zig's
            # linker accepts the flag.
            rust: 1.97.0
            test_musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test_native: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust || 'stable' }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ai-hist-napi-${{ matrix.target }}

      # napi's `--zig` uses zig as the cross linker/compiler. Pin a released zig
      # version so setup-zig fetches a stable release URL (an unpinned run hits
      # the master `builds` URL, which 404s).
      - name: Setup zig
        if: matrix.cross
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install deps
        run: npm ci

      - name: Build addon
        shell: bash
        run: |
          set -euo pipefail
          # Match the official Node 20/22 glibc baseline, independent of runner OS.
          if [ -n "${{ matrix.glibc }}" ]; then
            npx napi build --platform --release --target "${{ matrix.target }}" --zig --zig-abi-suffix "${{ matrix.glibc }}"
          elif [ "${{ matrix.cross }}" = "true" ]; then
            npx napi build --platform --release --target "${{ matrix.target }}" --zig
          else
            npx napi build --platform --release --target "${{ matrix.target }}"
          fi

      - name: Enforce GNU artifact glibc ceiling
        if: matrix.test_glibc
        shell: bash
        env:
          GLIBC_FLOOR: ${{ matrix.glibc }}
        run: |
          set -euo pipefail
          # Inspect the produced ELF, so compiler/toolchain changes cannot
          # silently raise the floor even when newer runtime tests pass.
          readelf --version-info ./*.node > /tmp/addon-versions.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          versions = {tuple(map(int, v.split('.'))) for v in re.findall(r'GLIBC_(\d+\.\d+(?:\.\d+)?)', Path('/tmp/addon-versions.txt').read_text())}
          floor = tuple(map(int, os.environ['GLIBC_FLOOR'].split('.')))
          if not versions or max(versions) > floor:
              raise SystemExit(f'Invalid glibc requirements: {sorted(versions)}; ceiling={floor}')
          print(f'Maximum required glibc: {".".join(map(str, max(versions)))}')
          PY

      - name: Execute native contract smoke test
        if: matrix.test_native
        shell: bash
        run: node ../../scripts/verify-native-contract.mjs ./index.js

      - name: Execute musl native contract smoke test
        if: matrix.test_musl
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/crates/ai-hist-napi node:22-alpine node ../../scripts/verify-native-contract.mjs ./index.js

      - name: Build CLI for Linux runtime smoke tests
        if: matrix.test_glibc || matrix.test_musl
        working-directory: sdk-ts
        run: npm ci --ignore-scripts && npm run build

      - name: Execute GNU CLI smoke tests on supported Linux runtimes
        if: matrix.test_glibc
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # Bookworm is explicit too: floating Node tags must not silently
          # move the oldest Debian runtime covered by this gate.
          for image in node:22-slim node:22 node:22-bookworm-slim ubuntu:22.04 ubuntu:24.04 node:22-trixie-slim; do
            bash scripts/smoke-linux-native.sh "$image" local
          done

      - name: Execute musl CLI smoke test
        if: matrix.test_musl
        working-directory: .
        run: bash scripts/smoke-linux-native.sh node:22-alpine local

      - uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.target }}
          path: crates/ai-hist-napi/*.node
          if-no-files-found: error

  helpers:
    name: Helper ${{ matrix.plugin }} ${{ matrix.platform }}
    needs: version
    if: ${{ inputs.plugins }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Every step here is a repository-root command.
    defaults:
      run:
        working-directory: .
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        plugin: [provider-sources]
        platform:
          [
            darwin-arm64,
            darwin-x64,
            linux-x64-gnu,
            linux-arm64-gnu,
            linux-x64-musl,
            linux-arm64-musl,
            win32-x64-msvc,
          ]
        include:
          - {
              platform: darwin-arm64,
              os: macos-15,
              target: aarch64-apple-darwin,
            }
          - {
              platform: darwin-x64,
              os: macos-15-intel,
              target: x86_64-apple-darwin,
            }
          - {
              platform: linux-x64-gnu,
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              abi: '.2.28',
              cross: true,
            }
          - {
              platform: linux-arm64-gnu,
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              abi: '.2.28',
              cross: true,
              rust: '1.97.0',
            }
          - {
              platform: linux-x64-musl,
              os: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              cross: true,
            }
          - {
              platform: linux-arm64-musl,
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-musl,
              cross: true,
              rust: '1.97.0',
            }
          - {
              platform: win32-x64-msvc,
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              suffix: '.exe',
            }
    steps:
      - uses: actions/checkout@v4
        with:
          # A skip_core re-run must rebuild the code the named release shipped,
          # never the newer dispatch commit. `format` is never empty, so the
          # normal ref only applies when skip_core is off.
          ref: ${{ inputs.skip_core && format('refs/tags/sdk-ts-v{0}', needs.version.outputs.version) || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust || 'stable' }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/${{ matrix.plugin }}/rust
          key: helper-${{ matrix.target }}
      - uses: mlugg/setup-zig@v1
        if: matrix.cross
        with:
          version: '0.13.0'
      - name: Install pinned cross linker
        if: matrix.cross
        run: cargo install cargo-zigbuild --version 0.20.1 --locked
      - name: Test helper packaging contracts
        run: node --test scripts/history-helper-packaging.composed.mjs
      - name: Stamp the release version into the plugin crates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          # The executables report CARGO_PKG_VERSION, so the crate version has to
          # be the release version before anything is compiled. The lock beside
          # each crate is rewritten with it, so --locked still resolves.
          node scripts/set-release-version.mjs "$VERSION"
      - name: Build and verify the helper executable
        id: helper
        shell: bash
        env:
          PLUGIN: ${{ matrix.plugin }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          ABI: ${{ matrix.abi }}
          CROSS: ${{ matrix.cross }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          manifest="plugins/$PLUGIN/rust/Cargo.toml"
          command=build
          if [ "$CROSS" = true ]; then command=zigbuild; fi
          binary=history-provider-sources
          release="plugins/$PLUGIN/rust/target/$TARGET/release"
          cargo "$command" --manifest-path "$manifest" --locked --release \
            --target "$TARGET$ABI" --bin "$binary"
          artifact="$release/$binary$SUFFIX"
          if [[ "$PLATFORM" == *musl ]]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work node:22-alpine node scripts/verify-history-helper.mjs "/work/$artifact"
          else
            node scripts/verify-history-helper.mjs "$artifact"
          fi
          if [ -n "$ABI" ]; then
            readelf --version-info "$artifact" > "$RUNNER_TEMP/versions.txt"
            ELF="$artifact" python3 -c 'import os,re; versions=[tuple(map(int,v.split("."))) for v in re.findall(r"GLIBC_(\d+\.\d+(?:\.\d+)?)",open(os.environ["RUNNER_TEMP"]+"/versions.txt").read())]; assert versions and max(versions)<=(2,28), (os.environ["ELF"], versions)'
          fi
          # The raw binary travels; the plugin job packages it at this version.
          echo "binary=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.plugin }}-${{ matrix.platform }}
          path: ${{ steps.helper.outputs.binary }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [version, build]
    if: ${{ !inputs.skip_core }}
    runs-on: ubuntu-latest
    # Only the publish job mints OIDC tokens (npm provenance).
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      # Passed through so the plugin jobs need only one dependency
      # for the version, whether or not the core was published in this run.
      version: ${{ needs.version.outputs.version }}
      # The tagged published tree, not the post-rebase branch tip. Plugins
      # package this SHA so a merge that landed during publish cannot sneak
      # into the version that was just put on the registry.
      release_sha: ${{ steps.tag-published-tree.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A real release tags the published tree once publishing and the
          # registry smoke tests succeed; persist-version then rebases that
          # commit onto the branch.
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Install deps
        run: npm ci
      - name: Apply the release version to the core manifests
        run: |
          set -euo pipefail
          # The version job resolved this once, before anything was built.
          test -n "$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          (
            cd ../../sdk-ts
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          )
          (
            cd ../../mcp-package
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            npm pkg set dependencies.ai-hist="$VERSION"
          )
          node - "$VERSION" <<'NODE'
          const fs = require("node:fs");
          const version = process.argv[2];
          const sdkLockPath = "../../sdk-ts/package-lock.json";
          const sdkLock = JSON.parse(fs.readFileSync(sdkLockPath, "utf8"));
          const nativeLink = sdkLock.packages["../crates/ai-hist-napi"];
          if (!nativeLink) {
            throw new Error("SDK lockfile is missing its local ai-hist-native package");
          }
          nativeLink.version = version;
          fs.writeFileSync(sdkLockPath, JSON.stringify(sdkLock, null, 2) + "\n");

          const files = [
            ["../../crates/ai-hist-napi/Cargo.toml", /(\[package\]\nname = "ai-hist-napi"\nversion = ")[^"]+("\n)/],
            ["../../crates/ai-hist/Cargo.toml", /(\[package\]\nname = "ai-hist"\nversion = ")[^"]+("\n)/],
            ["../../Cargo.lock", /(\[\[package\]\]\nname = "ai-hist-napi"\nversion = ")[^"]+("\n)/],
            ["../../Cargo.lock", /(\[\[package\]\]\nname = "ai-hist"\nversion = ")[^"]+("\n)/],
          ];
          for (const [path, pattern] of files) {
            const contents = fs.readFileSync(path, "utf8");
            if (!pattern.test(contents)) {
              throw new Error("Could not find ai-hist-napi version in " + path);
            }
            fs.writeFileSync(
              path,
              contents.replace(pattern, (_, prefix, suffix) => prefix + version + suffix),
            );
          }
          NODE
          echo "Publishing version $VERSION"

      - name: Verify package versions are aligned
        working-directory: .
        run: |
          node -e '
            const fs = require("node:fs");
            const manifests = [
              "crates/ai-hist-napi/package.json",
              "sdk-ts/package.json",
              "mcp-package/package.json",
            ].map((path) => [path, JSON.parse(fs.readFileSync(path, "utf8"))]);
            for (const [path, manifest] of manifests) {
              if (manifest.version !== process.env.VERSION) {
                throw new Error(path + " has version " + manifest.version);
              }
            }
            if (manifests[1][1].dependencies["ai-hist-native"] !== "file:../crates/ai-hist-napi") {
              throw new Error("ai-hist must keep its local native dependency while building");
            }
            if (manifests[2][1].dependencies["ai-hist"] !== process.env.VERSION) {
              throw new Error("ai-hist-mcp must pin ai-hist at the release version");
            }
            const lockVersions = [
              ["crates/ai-hist-napi/package-lock.json", ["", null]],
              ["sdk-ts/package-lock.json", ["", "../crates/ai-hist-napi"]],
            ];
            for (const [path, packageKeys] of lockVersions) {
              const lock = JSON.parse(fs.readFileSync(path, "utf8"));
              if (lock.version !== process.env.VERSION) {
                throw new Error(path + " has root version " + lock.version);
              }
              for (const key of packageKeys) {
                if (key !== null && lock.packages[key]?.version !== process.env.VERSION) {
                  throw new Error(path + " package " + key + " is not aligned");
                }
              }
            }
            for (const [path, name] of [
              ["crates/ai-hist-napi/Cargo.toml", "ai-hist-napi"],
              ["crates/ai-hist/Cargo.toml", "ai-hist"],
            ]) {
              const contents = fs.readFileSync(path, "utf8");
              const pattern = path.endsWith("Cargo.toml")
                ? new RegExp("\\[package\\]\\nname = \"" + name + "\"\\nversion = \"([^\"]+)\"")
                : null;
              const version = pattern.exec(contents)?.[1];
              if (version !== process.env.VERSION) {
                throw new Error(path + " has " + name + " version " + version);
              }
            }
            const lock = fs.readFileSync("Cargo.lock", "utf8");
            for (const name of ["ai-hist-napi", "ai-hist"]) {
              const pattern = new RegExp("\\[\\[package\\]\\]\\nname = \"" + name + "\"\\nversion = \"([^\"]+)\"");
              const version = pattern.exec(lock)?.[1];
              if (version !== process.env.VERSION) {
                throw new Error("Cargo.lock has " + name + " version " + version);
              }
            }
            console.log("All packages aligned at " + process.env.VERSION);
          '
      - name: Prepare release version commit
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always, whatever the plugins input: the release tag must carry
          # the same plugin manifests and crate versions the helper matrix built
          # from, so a later skip_core re-run against this tag publishes exactly
          # that, and the plugin job's re-application of this script is a no-op.
          node scripts/set-release-version.mjs "$VERSION"
          git add \
            plugins/provider-sources/sdk/package.json \
            plugins/provider-sources/sdk/package-lock.json \
            plugins/provider-sources/rust/Cargo.toml \
            plugins/provider-sources/rust/Cargo.lock \
            Cargo.lock \
            crates/ai-hist/Cargo.toml \
            examples/rust-consumer/Cargo.toml \
            examples/rust-consumer/Cargo.lock \
            crates/ai-hist-napi/Cargo.toml \
            crates/ai-hist-napi/package.json \
            crates/ai-hist-napi/package-lock.json \
            sdk-ts/package.json \
            sdk-ts/package-lock.json \
            mcp-package/package.json
          if git diff --cached --quiet; then
            echo "Version metadata is already committed at $VERSION"
          else
            git commit -m "chore: release $VERSION"
          fi
      - uses: actions/download-artifact@v4
        with:
          # Only the addon matrix; this run also carries helper binaries that
          # napi must never see.
          pattern: napi-*
          path: crates/ai-hist-napi/artifacts
      - name: Assemble per-platform packages
        # `-t .` is the target directory (creates ./npm/<platform>/); artifacts
        # then routes each downloaded .node into the matching platform dir.
        run: npx napi create-npm-dir -t . && npx napi artifacts --dir artifacts
      # npm >= 11.5 is required for the OIDC trusted-publisher flow (the runner's
      # bundled npm 10.x can't mint OIDC tokens, so publish fails unauthenticated).
      # Pinned to an exact version: npm@latest (12+) raised its Node engine floor
      # above the Node this workflow pins, breaking the publish (EBADENGINE), and
      # an exact pin keeps publishes reproducible.
      - name: Upgrade npm for OIDC
        if: ${{ !inputs.dry_run }}
        run: npm install -g npm@11.19.1
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # npm reads this for OIDC provenance (napi prepublish has no flag for it).
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          # GitHub release creation is handled after all registry smoke tests,
          # so napi must not create one while packages are still publishing.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — skipping publish. Prepared packages:"
            npx napi prepublish -t npm --dry-run --skip-gh-release || true
          else
            # Tokenless OIDC: each package name must be a trusted publisher on
            # npmjs (repo + this workflow). `prepublish` publishes the six
            # per-platform packages AND writes the main package's
            # optionalDependencies — but it does NOT publish the main package,
            # so we publish it explicitly afterward (from the crate root).
            npx napi prepublish -t npm --skip-gh-release
            npm publish --access public
          fi

      - name: Build SDK and CLI against the release contract
        working-directory: sdk-ts
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build
          SMOKE_HOME="$RUNNER_TEMP/relayhistory-smoke-home"
          SMOKE_DB="$RUNNER_TEMP/relayhistory-empty.db"
          export HOME="$SMOKE_HOME" USERPROFILE="$SMOKE_HOME" RELAYHISTORY_NO_UPDATE_CHECK=1
          mkdir -p "$SMOKE_HOME"
          set +e
          out=$(node dist/cli.js sessions list --db "$SMOKE_DB" --json --no-warning 2>&1)
          code=$?
          set -e
          test "$code" -eq 1
          node -e '
            const payload = JSON.parse(process.argv[1]);
            const expected = {
              status: "empty",
              indexed_prompts: 0,
              message: "No searchable local sessions found. Start a coding-agent session, then run ai-hist again.",
            };
            if (JSON.stringify(payload) !== JSON.stringify(expected)) {
              throw new Error("Unexpected empty-store payload: " + JSON.stringify(payload));
            }
          ' "$out"
          # Keep the local native package available through validation, then
          # rewrite only the manifest that will be packed and published.
          npm pkg set dependencies.ai-hist-native="$VERSION"
          node -e '
            const manifest = require("./package.json");
            if (manifest.version !== process.env.VERSION) {
              throw new Error("ai-hist version is not aligned");
            }
            if (manifest.dependencies["ai-hist-native"] !== process.env.VERSION) {
              throw new Error("ai-hist-native publish dependency is not aligned");
            }
          '
          if [ "${{ inputs.dry_run }}" = "true" ]; then npm pack --dry-run; fi

      - name: Publish SDK and CLI
        if: ${{ !inputs.dry_run }}
        working-directory: sdk-ts
        run: npm publish --access public

      - name: Build and publish MCP wrapper
        working-directory: mcp-package
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ]; then npm publish --access public; fi

      # Confirm all packages are visible before the compatibility gates. This
      # gives the registry time to converge without retrying every install.
      - name: Registry visibility gate
        if: ${{ !inputs.dry_run }}
        working-directory: .
        env:
          REGISTRY_VISIBILITY_ATTEMPTS: 36
          REGISTRY_VISIBILITY_DELAY_MS: 10000
        run: |
          node --input-type=module - "$VERSION" <<'NODE'
          import { waitForRegistryPackages } from "./scripts/registry-clean-install-smoke.mjs";
          const attempts = Number(process.env.REGISTRY_VISIBILITY_ATTEMPTS);
          const delayMs = Number(process.env.REGISTRY_VISIBILITY_DELAY_MS);
          await waitForRegistryPackages(process.argv[2], { attempts, delayMs });
          NODE

      # Push the immutable recovery point as soon as npm confirms visibility.
      # If a later runtime gate fails, skip_core can verify this exact tree and
      # finish the release without trying to republish immutable npm versions.
      - name: Tag the published tree
        id: tag-published-tree
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          set -euo pipefail
          test -n "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Discard the publish-only sdk-ts dependency rewrite so the tag
          # matches the version commit prepared earlier in this job.
          git reset --hard HEAD
          git tag -a "sdk-ts-v$VERSION" HEAD -m "ai-hist@$VERSION"
          git push origin "refs/tags/sdk-ts-v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-core:
    name: Verify published core
    needs: [version, publish]
    # A normal run verifies after npm publication. A skip_core retry verifies
    # the existing tagged release before resuming any downstream mutation.
    if: ${{ !cancelled() && !inputs.dry_run && needs.version.result == 'success' && (inputs.skip_core || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/sdk-ts-v{0}', needs.version.outputs.version) }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Match release npm version
        run: npm install -g npm@11.19.1
      - name: Registry clean-install smoke test
        env:
          REGISTRY_VISIBILITY_ATTEMPTS: 36
          REGISTRY_VISIBILITY_DELAY_MS: 10000
          NPM_REGISTRY_RETRY_ATTEMPTS: 36
          NPM_REGISTRY_RETRY_DELAY_MS: 10000
        run: node scripts/registry-clean-install-smoke.mjs
      - name: Registry CLI smoke test on older glibc
        run: |
          set -euo pipefail
          for image in node:22-bookworm-slim ubuntu:22.04; do
            bash scripts/smoke-linux-native.sh "$image" registry "$VERSION"
          done

  finalize-core:
    name: Finalize verified core release
    needs: [version, publish, verify-core]
    if: ${{ !cancelled() && !inputs.dry_run && needs.verify-core.result == 'success' && (inputs.skip_core || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create GitHub Release after runtime verification
        run: |
          set -euo pipefail
          tag="sdk-ts-v$VERSION"
          gh api "repos/${GH_REPO}/git/ref/tags/$tag" >/dev/null
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; leave it unchanged"
          else
            gh release create "$tag" \
              --title "ai-hist@$VERSION" \
              --generate-notes
          fi

  persist-version:
    name: Persist release version
    needs: [version, publish, finalize-core]
    # Bookkeeping only: npm, the tag and the GitHub Release already exist.
    # Crate and plugins depend on `finalize-core`, not this job, so a rebase
    # conflict cannot drop a version that is already on the registry.
    if: ${{ !cancelled() && !inputs.dry_run && !inputs.skip_core && needs.finalize-core.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Persist release version
        working-directory: .
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Release versions can only be persisted from a branch checkout" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/persist-release-version.sh "${GITHUB_REF#refs/heads/}" "${{ github.sha }}"

  publish-crate:
    name: Publish crate to crates.io
    needs: [version, publish, verify-core, finalize-core]
    # skip_core is the crates.io-only retry: npm already published this version
    # and tagged it, so this job checks out that tag instead of the dispatch SHA.
    if: ${{ !cancelled() && needs.version.result == 'success' && ((inputs.dry_run && (inputs.skip_core || needs.publish.result == 'success')) || (!inputs.dry_run && needs.verify-core.result == 'success' && needs.finalize-core.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.skip_core && format('refs/tags/sdk-ts-v{0}', needs.version.outputs.version) || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp the crate at the release version
        run: |
          set -euo pipefail
          test -n "$VERSION"
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          root = pathlib.Path(".")
          files = [
              (root / "crates/ai-hist/Cargo.toml", r'(\[package\]\nname = "ai-hist"\nversion = ")[^"]+(")'),
              (root / "Cargo.lock", r'(\[\[package\]\]\nname = "ai-hist"\nversion = ")[^"]+(")'),
          ]
          for path, pattern in files:
              text = path.read_text()
              updated, n = re.subn(pattern, rf"\g<1>{version}\g<2>", text, count=1)
              if n != 1:
                  raise SystemExit(f"could not stamp ai-hist version in {path}")
              path.write_text(updated)
          PY
      - name: cargo publish dry-run
        run: cargo publish --dry-run -p ai-hist --allow-dirty --locked
      - name: Check whether this version is already on crates.io
        id: crate-gate
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # crates.io 403s requests without a User-Agent. Treat only 200/404 as
          # known; any other status or a transport error must fail this gate
          # rather than look like "not published" and retry cargo publish.
          status="$(
            curl -sS -o /dev/null -w "%{http_code}" \
              -A "relayhistory-publish-crate (github.com/AgentWorkforce/relayhistory)" \
              "https://crates.io/api/v1/crates/ai-hist/${VERSION}"
          )"
          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "ai-hist ${VERSION} already exists on crates.io; skip"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io lookup returned HTTP ${status}; not publishing"
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        if: ${{ !inputs.dry_run && steps.crate-gate.outputs.exists != 'true' }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: ${{ !inputs.dry_run && steps.crate-gate.outputs.exists != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          # Dry-run already compiled the package. The token is the short-lived
          # crates.io credential minted from GitHub OIDC above, not a repo secret.
          cargo publish -p ai-hist --allow-dirty --locked --no-verify

  package-plugins:
    name: Package optional history plugins
    needs: [version, helpers]
    if: ${{ !cancelled() && inputs.plugins && needs.version.result == 'success' && needs.helpers.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Normal releases package the immutable dispatch SHA while core npm
          # publication runs. A retry must use the already-published tag.
          ref: ${{ inputs.skip_core && format('refs/tags/sdk-ts-v{0}', needs.version.outputs.version) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            crates/ai-hist-napi/package-lock.json
            sdk-ts/package-lock.json
            plugins/provider-sources/sdk/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: helper-*
          path: helpers
      - name: Refuse a plugin-only retry from a pre-rename release
        if: ${{ inputs.skip_core }}
        run: |
          set -euo pipefail
          for plugin in provider-sources; do
            name=$(node -p "require('./plugins/$plugin/sdk/package.json').name")
            case "$name" in
              @relayhistory/*) ;;
              *)
                echo "release tag sdk-ts-v${VERSION} predates the @relayhistory rename ($plugin is still $name)." >&2
                echo "A plugin-only retry cannot publish @relayhistory/* from it; cut a normal release instead." >&2
                exit 1
                ;;
            esac
          done
      - name: Apply the release version
        run: |
          set -euo pipefail
          test -n "$VERSION"
          node scripts/set-release-version.mjs "$VERSION"
          (cd crates/ai-hist-napi && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          (cd sdk-ts && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          node -e '
            const fs = require("node:fs");
            const path = "sdk-ts/package-lock.json";
            const lock = JSON.parse(fs.readFileSync(path, "utf8"));
            const native = lock.packages["../crates/ai-hist-napi"];
            if (!native) throw new Error("SDK lockfile is missing its local ai-hist-native package");
            native.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(lock, null, 2) + "\n");
          '
      - name: Build the local core and the plugin SDK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm --prefix crates/ai-hist-napi ci
          npm --prefix crates/ai-hist-napi run build:debug
          npm --prefix sdk-ts ci
          for plugin in provider-sources; do
            npm --prefix "plugins/$plugin/sdk" ci --ignore-scripts
            npm --prefix "plugins/$plugin/sdk" run build
            (cd "plugins/$plugin/sdk" && npm pack --ignore-scripts --pack-destination ../../../artifacts)
          done
      - name: Package the platform helpers
        run: |
          set -euo pipefail
          mkdir -p artifacts staged
          node -e '
            import("./scripts/history-package-contract.mjs").then(({ plugins, platforms }) => {
              for (const [plugin, info] of Object.entries(plugins)) {
                for (const platform of Object.keys(platforms)) {
                  const binary = info.binary + (platform.startsWith("win32") ? ".exe" : "");
                  console.log([plugin, platform, binary].join(" "));
                }
              }
            });
          ' > "$RUNNER_TEMP/helpers.txt"
          while read -r plugin platform binary; do
            built="helpers/helper-$plugin-$platform/$binary"
            test -f "$built"
            node scripts/package-history-helper.mjs "$plugin" "$platform" "$VERSION" "$built" "staged/$plugin-$platform"
            (cd "staged/$plugin-$platform" && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/artifacts")
          done < "$RUNNER_TEMP/helpers.txt"
      - name: Verify installed core and optional artifacts
        run: node scripts/smoke-history-packages.mjs --helpers artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  plugins:
    name: Publish optional plugin ${{ matrix.plugin }}
    needs: [version, publish, verify-core, finalize-core, package-plugins]
    # `publish` is deliberately skipped by a skip_core re-run, so it is only
    # required when this run is actually releasing the core.
    if: ${{ !cancelled() && inputs.plugins && needs.version.result == 'success' && needs.package-plugins.result == 'success' && ((inputs.dry_run && (inputs.skip_core || needs.publish.result == 'success')) || (!inputs.dry_run && needs.verify-core.result == 'success' && needs.finalize-core.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PLUGIN: ${{ matrix.plugin }}
    strategy:
      fail-fast: false
      matrix:
        plugin: [provider-sources]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.skip_core && format('refs/tags/sdk-ts-v{0}', needs.version.outputs.version) || needs.publish.outputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: plugin-packages
          path: artifacts
      # A skip_core retry takes its whole tree from the release tag, including
      # the plugin manifests and the package contract that every later step
      # derives coordinates from. Tags cut before the @relayhistory rename
      # still name their plugins @agent-relay/*, and those names still produce
      # valid tarballs — so such a retry would publish the obsolete packages
      # and report success, leaving @relayhistory/* absent.
      #
      # Repeat the packaging-stage guard at the mutation boundary. A
      # workflow_dispatch run reads this file from the dispatch ref, not from
      # `ref:` above, so this literal cannot be rewritten by a stale tag.
      #
      # There is no correct way to publish @relayhistory/* from a tag that does
      # not contain those names — doing so would mix post-rename code into an
      # older release, which is exactly what skip_core exists to avoid. So this
      # refuses rather than repairs: cut a normal release instead.
      - name: Refuse a plugin-only retry from a pre-rename release
        if: ${{ inputs.skip_core }}
        run: |
          set -euo pipefail
          for plugin in provider-sources; do
            name=$(node -p "require('./plugins/$plugin/sdk/package.json').name")
            case "$name" in
              @relayhistory/*) ;;
              *)
                echo "release tag sdk-ts-v${VERSION} predates the @relayhistory rename ($plugin is still $name)." >&2
                echo "A plugin-only retry cannot publish @relayhistory/* from it; cut a normal release instead." >&2
                exit 1
                ;;
            esac
          done
      # Each row checks the oldest core admitted by the plugin it is about to
      # publish. The new core has already passed its full runtime gate.
      - name: Verify actual published core compatibility before publication
        if: ${{ !inputs.dry_run }}
        run: node scripts/verify-published-history-core.mjs "$PLUGIN"
      # Same requirement, same pin as the core publish job: npm >= 11.5 mints
      # the OIDC token, and the runner's bundled npm 10.x cannot, so without
      # this the tokenless publish below fails ENEEDAUTH exactly as it did with
      # the blank token. Pinned exactly because npm@latest (12+) raised its Node
      # engine floor above the Node pinned here (EBADENGINE).
      - name: Upgrade npm for OIDC
        if: ${{ !inputs.dry_run }}
        run: npm install -g npm@11.19.1

      - name: Publish platform helpers before JavaScript plugins
        if: ${{ !inputs.dry_run }}
        # No NODE_AUTH_TOKEN. This job has `id-token: write` and publishes the
        # same way the core job does: npm OIDC trusted publishing, bound to
        # this repository plus this workflow file name.
        #
        # It used to set `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`. That
        # secret does not exist in this repository, and setup-node writes
        # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc unconditionally, so the
        # empty value produced a blank credential that suppressed OIDC:
        #
        #   npm error code ENEEDAUTH
        #   npm error need auth This command requires you to be logged in
        #
        # That error was invisible until the file-spec fix (#152) let npm get
        # far enough to contact the registry at all.
        run: |
          set -euo pipefail
          # Every tarball path is written `./artifacts/...`. npm-package-arg
          # reads a bare `dir/file.tgz` as GitHub `owner/repo` shorthand, so a
          # path without the leading `./` is resolved as a git remote:
          #   npm error command git ls-remote ssh://git@github.com/artifacts/...
          # That is why these helpers had never published on any release.
          #
          # nullglob turns a pattern that matches nothing into no words at all
          # rather than the literal pattern, and the counter below fails the
          # release instead of silently publishing a partial platform set.
          shopt -s nullglob
          prefix=$(node -p "require('./plugins/$PLUGIN/sdk/package.json').name.replace('@', '').replace('/', '-')")
          helpers=(
            ./artifacts/"$prefix"-darwin-*-"$VERSION".tgz
            ./artifacts/"$prefix"-linux-*-"$VERSION".tgz
            ./artifacts/"$prefix"-win32-*-"$VERSION".tgz
          )
          if [ "${#helpers[@]}" -eq 0 ]; then
            echo "no platform helpers staged for $PLUGIN at $VERSION" >&2
            exit 1
          fi
          for package in "${helpers[@]}"; do
            npm publish "$package" --access public --provenance
          done
          npm publish "./artifacts/$prefix-$VERSION.tgz" --access public --provenance
      - name: List this plugin's staged tarballs
        if: ${{ inputs.dry_run }}
        run: |
          prefix=$(node -p "require('./plugins/$PLUGIN/sdk/package.json').name.replace('@', '').replace('/', '-')")
          ls -1 artifacts/"$prefix"-*.tgz

  # The registry proof is a separate required release job, so it runs once
  # every plugin in the matrix above has published.
  verify-plugins:
    name: Verify published plugins
    needs: [version, publish, plugins]
    if: ${{ !cancelled() && !inputs.dry_run && inputs.plugins && needs.plugins.result == 'success' && (inputs.skip_core || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.skip_core && format('refs/tags/sdk-ts-v{0}', needs.version.outputs.version) || needs.publish.outputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify the published plugins install from the registry
        run: node scripts/verify-published-plugins.mjs "$VERSION"
