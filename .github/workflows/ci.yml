name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # A marker-only commit immediately dispatches the release workflow, whose
    # platform matrices otherwise compete with this entire suite for macOS and
    # Windows runners. The code at that commit was already checked by its PR.
    paths-ignore:
      - '.release/dispatch-patch-*'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # This is the critical-path job. Keep its cache separate from the much
      # larger release matrix so a PR does not evict every release target.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-verify

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            crates/ai-hist-napi/package-lock.json
            sdk-ts/package-lock.json

      - name: Physically remove the optional provider-sources plugin
        run: rm -rf plugins

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Release workflow tests
        run: node --test scripts/*.test.mjs

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -A clippy::too_many_arguments -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features

      # Runs after "Rust tests" on purpose: that step has already compiled the
      # sync_bench target in this profile, so the gate spends its time
      # measuring rather than building. See docs/benchmarks.md.
      - name: Sync and hydration throughput gate
        run: node scripts/benchmark-sync.mjs --gate

      # `test`, not `build`: it compiles everything `build` did and then runs
      # what only exists in this configuration. Two whole classes of test are
      # invisible to the `--all-features` run above -- the `#[cfg(not(feature
      # = "export"))]` ones, and the integration tests that exercise the
      # public surface an embedder actually gets, where `unstable-internal`
      # is not there to re-export the internals. Both were passing locally
      # and gated by nothing.
      - name: Published crate builds and tests without optional features
        run: cargo test -p ai-hist --no-default-features

      - name: Crate publish dry-run
        run: cargo publish --dry-run -p ai-hist --allow-dirty

      - name: Native binding contract
        working-directory: crates/ai-hist-napi
        run: |
          npm ci
          npm run build:debug
          node ../../scripts/verify-native-contract.mjs ./index.js
          git diff --exit-code -- index.d.ts

      - name: TypeScript tests
        working-directory: sdk-ts
        run: |
          npm ci
          npm run lint
          npm test

      - name: Installed local SDK and CLI smoke test
        run: node scripts/smoke-history-packages.mjs

  # The crate's default-feature surface is what an embedder gets, and Cargo
  # semver is the only contract it has. The listing is regenerated here and
  # diffed against crates/ai-hist/public-api.txt, so a change to the surface
  # is visible in the pull request that makes it, and must come with an
  # updated snapshot and a `### Rust API` changelog entry. The check also
  # fails on any `rusqlite` type in the listing: an embedder never holds a
  # raw connection. See docs/sourcing-sdk.md.
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustdoc's JSON output, which cargo-public-api reads, is nightly-only;
      # the tool itself is built and run on stable and invokes `+nightly` for
      # the rustdoc step. Nightly first so stable stays the default.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        id: cargo-public-api-cache
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ runner.os }}-0.52.0
      - name: Install cargo-public-api
        if: steps.cargo-public-api-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Public API matches the checked-in snapshot
        run: node scripts/check-public-api.mjs

  # Nothing in the workspace proves that a crate outside it can consume
  # ai-hist. examples/rust-consumer is that crate: not a workspace member, its
  # own lockfile, a crates.io dependency on the default features. Here the
  # dependency is redirected at this checkout with `[patch.crates-io]`, so a
  # pull request is checked before the crate is published; the nightly
  # published-crate-consumer workflow builds the same example against the
  # crate crates.io actually serves.
  rust-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Redirect the example's crates.io dependency at this checkout
        working-directory: examples/rust-consumer
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [patch.crates-io]
          ai-hist = { path = "${{ github.workspace }}/crates/ai-hist" }
          EOF
      - name: Build and run the consumer against the workspace crate
        working-directory: examples/rust-consumer
        run: cargo run
      # A patch Cargo cannot apply is a warning, not an error, and the run
      # above would then have tested the published crate. The version in
      # crates/ai-hist must satisfy the example's requirement; the release
      # script moves the two together.
      - name: The workspace crate was the one built
        working-directory: examples/rust-consumer
        run: |
          cargo tree --prefix none --depth 1 -e normal | tee /dev/stderr \
            | grep -qE '^ai-hist v[0-9.]+ \(.*/crates/ai-hist\)$'

  # burn (AgentWorkforce/burn) is moving to reading session evidence through
  # this crate (burn #557; the cutover is burn 5.0.0, burn #562) and derives
  # its ledger identity from it: a change here to message ids, timestamps or
  # usage dedup changes burn's turn fingerprints and duplicates or collapses
  # its cost rows, and nothing in this workspace can see that. This job builds
  # burn against this checkout and runs burn's relayhistory parity suite over
  # the shared fixture corpus (#183). Steps, all in scripts/burn-guardrails.mjs:
  #
  # - relevant-change: only a change under crates/ai-hist/, the workspace
  #   Cargo.toml, this job or the script runs the rest. Otherwise the job
  #   passes in seconds, so it can still be a required check.
  # - parity-probe: arms once burn's relayburn-sdk depends on ai-hist. The
  #   suite is the `relayhistory_parity` test target if burn has one, else the
  #   lib tests under a `relayhistory` module path. No dependency yet is a
  #   notice; a dependency without a suite is a warning.
  # - pin-ai-hist: rewrites burn's ai-hist requirement to a path dependency on
  #   this checkout. `[patch.crates-io]` would silently stop applying the day
  #   this workspace's version moves past burn's pin.
  # - check-resolution: proves burn resolved this checkout's ai-hist.
  # - run-parity: runs the suite and fails if it ran zero tests.
  #
  # burn is checked out at the repository variable BURN_REF when it is set,
  # else main. If burn main breaks on its own, set BURN_REF to a known-good
  # burn commit so relayhistory PRs are not blocked, and clear it once burn is
  # green again. There is no base-vs-PR differential run: a red result means
  # "burn at BURN_REF fails against this code", so re-run the base branch to
  # tell a regression here from breakage in burn. Making the job a required
  # check is a branch-protection setting.
  burn-contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, for relevant-change. On
          # push, relevant-change fetches the event's `before` itself.
          fetch-depth: 2
          # This job builds and tests burn's code; keep GITHUB_TOKEN out of
          # .git/config. relevant-change's fetch from this public repo needs none.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Does this change touch what burn consumes?
        id: relevant
        run: node scripts/burn-guardrails.mjs relevant-change
      - uses: actions/checkout@v4
        if: steps.relevant.outputs.run == 'true'
        with:
          repository: AgentWorkforce/burn
          ref: ${{ vars.BURN_REF || 'main' }}
          path: burn
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: steps.relevant.outputs.run == 'true'
      - name: Does burn have a relayhistory parity suite?
        id: probe
        if: steps.relevant.outputs.run == 'true'
        run: node scripts/burn-guardrails.mjs parity-probe --burn-dir burn
      - uses: Swatinem/rust-cache@v2
        if: steps.probe.outputs.ready == 'true'
        with:
          workspaces: burn -> target
          key: ci-burn-contract-drift
      - name: Point burn's ai-hist requirement at this checkout
        if: steps.probe.outputs.ready == 'true'
        run: node scripts/burn-guardrails.mjs pin-ai-hist --burn-dir burn --ai-hist-path "$GITHUB_WORKSPACE/crates/ai-hist"
      - name: burn resolves ai-hist to this checkout
        if: steps.probe.outputs.ready == 'true'
        run: node scripts/burn-guardrails.mjs check-resolution --burn-dir burn --ai-hist-path "$GITHUB_WORKSPACE/crates/ai-hist"
      - name: burn parity suite against this checkout
        if: steps.probe.outputs.ready == 'true'
        run: node scripts/burn-guardrails.mjs run-parity --burn-dir burn

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: MSRV check
        run: cargo check -p ai-hist --all-features --locked

  node-22-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            crates/ai-hist-napi/package-lock.json
            sdk-ts/package-lock.json
      - name: Build native addon
        working-directory: crates/ai-hist-napi
        run: npm ci && npm run build:debug
      - name: Test SDK on Node 22
        working-directory: sdk-ts
        run: npm ci && npm test

  optional-history-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            crates/ai-hist-napi/package-lock.json
            sdk-ts/package-lock.json
            plugins/provider-sources/sdk/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins/provider-sources/rust -> target
          key: ci-optional-history-plugins
      - name: Optional helper packaging contracts
        run: node --test scripts/history-helper-packaging.composed.mjs
      - name: Build composed distribution
        run: |
          cargo build --manifest-path plugins/provider-sources/rust/Cargo.toml --locked
          npm --prefix crates/ai-hist-napi ci
          npm --prefix crates/ai-hist-napi run build:debug
          npm --prefix sdk-ts ci
          npm --prefix plugins/provider-sources/sdk ci --ignore-scripts
          npm --prefix plugins/provider-sources/sdk run build
      # The plugin is not a workspace member and declares its own [workspace],
      # so `cargo test --workspace` in `verify` cannot reach it -- that job
      # deletes `plugins/` first in any case. The build above compiles only the
      # bin and lib targets, never `#[cfg(test)]` code. Without this step the
      # crate's own test suite never runs anywhere.
      - name: Optional plugin Rust tests
        run: cargo test --manifest-path plugins/provider-sources/rust/Cargo.toml --locked
      - name: Optional plugin SDK tests
        env:
          HISTORY_PROVIDER_SOURCES_BIN: ${{ github.workspace }}/plugins/provider-sources/rust/target/debug/history-provider-sources
        run: npm --prefix plugins/provider-sources/sdk test
      - name: Installed composed tarballs
        run: |
          mkdir -p helper-packs
          version=$(node -p "require('./plugins/provider-sources/sdk/package.json').version")
          node scripts/package-history-helper.mjs provider-sources linux-x64-gnu "$version" plugins/provider-sources/rust/target/debug/history-provider-sources helper-stage/provider-sources
          (cd helper-stage/provider-sources && npm pack --ignore-scripts --pack-destination ../../helper-packs)
          node scripts/smoke-history-packages.mjs --helpers helper-packs

  windows-helper-cancellation:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build local native addon and optional SDK runtimes
        run: |
          set -euo pipefail
          npm --prefix crates/ai-hist-napi ci
          npm --prefix crates/ai-hist-napi run build:debug
          npm --prefix sdk-ts ci
          npm --prefix plugins/provider-sources/sdk ci --ignore-scripts
          npm --prefix plugins/provider-sources/sdk run build
      - name: Verify actual Windows descendant cleanup and missing executable errors
        run: node --test plugins/provider-sources/sdk/dist/helper-runtime.test.js
      - name: Verify shell-free packaging contracts
        run: node --test scripts/history-helper-packaging.composed.mjs
      - name: Verify installed local SDK on Windows
        run: node scripts/smoke-history-packages.mjs

  # The History service engine is independent of the Rust workspace and the SDK. It
  # runs its whole suite on in-process PGlite (pgvector + pg_trgm) and again against
  # real PostgreSQL with pgvector over node-postgres, the self-hosted driver, on the
  # oldest and newest supported server versions.
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: pglite
          - database: postgres
            image: pgvector/pgvector:pg16
          - database: postgres
            image: pgvector/pgvector:pg17
    services:
      postgres:
        image: ${{ matrix.image || 'pgvector/pgvector:pg17' }}
        env:
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: engine
          POSTGRES_DB: engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/engine/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test on PGlite
        if: ${{ matrix.database == 'pglite' }}
        run: npm test
      - name: Test on PostgreSQL
        if: ${{ matrix.database == 'postgres' }}
        env:
          DATABASE_URL: postgres://engine:engine@localhost:5432/engine
        run: npm run test:postgres
      - name: Packed tarball in a clean consumer
        if: ${{ matrix.database == 'postgres' }}
        env:
          DATABASE_URL: postgres://engine:engine@localhost:5432/engine
        run: node scripts/pack-smoke.mjs
      - name: Build and pack
        if: ${{ matrix.database == 'pglite' }}
        run: |
          set -euo pipefail
          npm run build
          npm pack --dry-run
