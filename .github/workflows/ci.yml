name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json

      - name: Physically remove optional cloud and provider packages
        run: rm -rf plugins

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Release workflow tests
        run: node --test scripts/*.test.mjs

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -A clippy::too_many_arguments -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features

      - name: Published crate builds without optional features
        run: cargo build -p ai-hist --no-default-features

      - name: Crate publish dry-run
        run: cargo publish --dry-run -p ai-hist --allow-dirty

      - name: Native binding contract
        working-directory: crates/ai-hist-napi
        run: |
          npm ci
          npm run build:debug
          node ../../scripts/verify-native-contract.mjs ./index.js
          git diff --exit-code -- index.d.ts

      - name: TypeScript tests
        working-directory: sdk-ts
        run: |
          npm ci
          npm run lint
          npm test

      - name: Installed local SDK and CLI smoke test
        run: node scripts/smoke-history-packages.mjs

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: MSRV check
        run: cargo check -p ai-hist --all-features --locked

  node-22-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            crates/ai-hist-napi/package-lock.json
            sdk-ts/package-lock.json
      - name: Build native addon
        working-directory: crates/ai-hist-napi
        run: npm ci && npm run build:debug
      - name: Test SDK on Node 22
        working-directory: sdk-ts
        run: npm ci && npm test

  windows-state-replacement:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify repeated private-state replacement
        run: cargo test --manifest-path plugins/relayhistory/rust/Cargo.toml write_private_replaces_existing_state

  optional-history-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Optional helper packaging contracts
        run: node --test scripts/history-helper-packaging.composed.mjs
      - name: Build composed distribution
        run: |
          cargo build --manifest-path plugins/relayhistory/rust/Cargo.toml --locked
          cargo build --manifest-path plugins/provider-sources/rust/Cargo.toml --locked
          npm --prefix crates/ai-hist-napi ci
          npm --prefix crates/ai-hist-napi run build:debug
          npm --prefix sdk-ts ci
          for plugin in relayhistory provider-sources; do
            npm --prefix "plugins/$plugin/sdk" ci --ignore-scripts
            npm --prefix "plugins/$plugin/sdk" run build
          done
      # Neither plugin is a workspace member, and each declares its own
      # [workspace], so `cargo test --workspace` in `verify` cannot reach them —
      # that job deletes `plugins/` first in any case. The build above compiles
      # only the bin and lib targets, never `#[cfg(test)]` code, and
      # `native-cloud-probe` tests the probe binary alone. Without this step the
      # crates' own test suites never run anywhere, which is how a test calling
      # a private function reached main with every check green.
      - name: Optional plugin Rust tests
        run: |
          cargo test --manifest-path plugins/relayhistory/rust/Cargo.toml --locked
          cargo test --manifest-path plugins/provider-sources/rust/Cargo.toml --locked
      - name: Optional plugin SDK tests
        env:
          RELAYHISTORY_PLUGIN_BIN: ${{ github.workspace }}/plugins/relayhistory/rust/target/debug/relayhistory-plugin
          HISTORY_PROVIDER_SOURCES_BIN: ${{ github.workspace }}/plugins/provider-sources/rust/target/debug/history-provider-sources
        run: |
          npm --prefix plugins/relayhistory/sdk test
          npm --prefix plugins/provider-sources/sdk test
      - name: Installed composed tarballs
        run: |
          mkdir -p helper-packs
          for plugin in relayhistory provider-sources; do
            binary=history-provider-sources
            if [ "$plugin" = relayhistory ]; then binary=relayhistory-plugin; fi
            version=$(node -p "require('./plugins/$plugin/sdk/package.json').version")
            node scripts/package-history-helper.mjs "$plugin" linux-x64-gnu "$version" "plugins/$plugin/rust/target/debug/$binary" "helper-stage/$plugin"
            (cd "helper-stage/$plugin" && npm pack --ignore-scripts --pack-destination ../../helper-packs)
          done
          node scripts/smoke-history-packages.mjs --helpers helper-packs

  windows-helper-cancellation:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build local native addon and optional SDK runtimes
        run: |
          set -euo pipefail
          npm --prefix crates/ai-hist-napi ci
          npm --prefix crates/ai-hist-napi run build:debug
          npm --prefix sdk-ts ci
          for plugin in relayhistory provider-sources; do
            npm --prefix "plugins/$plugin/sdk" ci --ignore-scripts
            npm --prefix "plugins/$plugin/sdk" run build
          done
      - name: Verify actual Windows descendant cleanup and missing executable errors
        run: node --test plugins/relayhistory/sdk/dist/helper-runtime.test.js plugins/provider-sources/sdk/dist/helper-runtime.test.js
      - name: Verify shell-free packaging contracts
        run: node --test scripts/history-helper-packaging.composed.mjs
      - name: Verify installed local SDK on Windows
        run: node scripts/smoke-history-packages.mjs

  native-cloud-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe regression tests
        run: cargo test --manifest-path plugins/relayhistory/rust/Cargo.toml --bin agent-relay-probe --locked
      - name: Native release build
        run: cargo build --manifest-path plugins/relayhistory/rust/Cargo.toml --release --bin agent-relay-probe --locked
      - name: Executable smoke check
        run: plugins/relayhistory/rust/target/release/agent-relay-probe --version
