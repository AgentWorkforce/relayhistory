name: Dispatch publish

# Lets operators trigger the gated publish workflow by pushing a marker file
# when local `gh workflow run` is unavailable. Marker files are one-shot and
# live under .release/dispatch-patch-*.

on:
  push:
    branches:
      - main
    paths:
      - '.release/dispatch-patch-*'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = fs.readdirSync('.release')
              .filter((name) => name.startsWith('dispatch-patch-'))
              .sort()
              .at(-1);
            const body = marker ? fs.readFileSync(`.release/${marker}`, 'utf8').trim() : '';
            const customVersion = /^\\d+\\.\\d+\\.\\d+$/.test(body.split(/\r?\n/, 1)[0]) ? body.split(/\r?\n/, 1)[0] : '';
            core.info(`Dispatching publish-napi from ${context.sha}${customVersion ? ` as ${customVersion}` : ' (patch bump)'}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-napi.yml',
              ref: 'main',
              inputs: {
                version: 'patch',
                custom_version: customVersion,
                dry_run: 'false',
              },
            });
