[package]
name = "ai-hist-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ai-hist"
path = "src/main.rs"

[dependencies]
ai-hist = { path = "../ai-hist", features = [
    "export",
    "fs-events",
    "opencode-backup",
    "git-hooks",
    "unstable-internal",
] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled", "functions"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
url = "2"
