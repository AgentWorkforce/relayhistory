[package]
name = "ai-hist-napi"
version = "0.18.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ai-hist = { path = "../ai-hist", features = ["delivery", "opencode-backup", "git-hooks", "unstable-internal"] }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
napi = { version = "2", default-features = false, features = ["napi4", "tokio_rt", "tokio_time"] }
napi-derive = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
napi-build = "2"
