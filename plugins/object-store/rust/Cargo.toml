[package]
name = "relayhistory-object-store"
version = "0.1.0"
edition = "2021"
license = "MIT"
# `std::fs::File::lock` (FsStore's conditional-update lock) is stable from 1.89.
rust-version = "1.89"
description = "Object-storage destination adapters (S3, GCS, Azure Blob, filesystem) for RelayHistory raw session delivery"
publish = false

# Not a member of the root workspace, on purpose: the local read/write hot path
# (`ai-hist`, the napi addon, the CLI) must never link a cloud SDK. CI's
# `verify` job deletes `plugins/` before building the core to prove it.
[workspace]

[features]
default = ["s3", "gcs", "azure", "scrub"]
# PII/secret scrubbing of raw chunks before upload (see src/scrub).
scrub = ["dep:fancy-regex", "dep:regex"]
s3 = ["object_store/aws"]
gcs = ["object_store/gcp"]
azure = ["object_store/azure"]
# Exposes `conformance::run_suite` so out-of-tree adapters can prove themselves
# against the same contract.
conformance = ["dep:rand"]

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hex = "0.4"
object_store = { version = "0.14.2", default-features = false, features = ["fs"] }
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
fancy-regex = { version = "0.20", optional = true }
regex = { version = "1", optional = true }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "fs", "time"] }
tracing = "0.1"
url = "2"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
httpdate = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "conformance"
required-features = ["conformance", "s3", "gcs", "azure"]

[[test]]
name = "manifest"
required-features = ["s3", "azure"]

[[test]]
name = "scrub_golden"
required-features = ["scrub"]

[[bench]]
name = "scrub"
harness = false
required-features = ["scrub"]

# The scrub rules run regex engines over 256 KiB strings in the golden and
# boundary tests; optimizing just these crates keeps debug test runs fast
# without changing behaviour.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3
