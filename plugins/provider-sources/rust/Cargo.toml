[package]
name = "history-provider-sources"
version = "0.53.1"
edition = "2021"
license = "MIT"
# Ships only as the npm platform helper packages. Rust hosts use the
# connectors through `ai-hist`'s `remote-sources` feature on crates.io.
publish = false

[workspace]

[dependencies]
ai-hist = { path = "../../../crates/ai-hist", features = ["remote-sources"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
