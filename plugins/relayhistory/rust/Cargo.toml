[package]
name = "relayhistory-plugin"
version = "0.18.4"
edition = "2021"
license = "MIT"
default-run = "relayhistory-plugin"

[[bin]]
name = "agent-relay-probe"
path = "src/probe/main.rs"

[workspace]

[dependencies]
ai-hist-core = { path = "../../../crates/ai-hist-core" }
ai-hist-engine = { path = "../../../crates/ai-hist" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
atomicwrites = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
hostname = "0.4"
libc = "0.2"
rusqlite = { version = "0.32", features = ["backup", "bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
url = "2"
